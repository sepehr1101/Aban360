name: Controller regressions
on:
  pull_request:
  push:
    branches: [master, dev]
  workflow_dispatch:
jobs:
  controller-regressions:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build and run controller suites
        shell: pwsh
        run: ./scripts/test-merged-controllers.ps1
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controller-test-results
          path: artifacts/test-results/
          if-no-files-found: ignore
